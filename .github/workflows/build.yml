name: build

on:
  pull_request:
    branches:    
      - main
      - develop

    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "tmp"
      - "source"
      - "tools"
      - "gulpfile.js"
      - "source"
      

jobs:
  build:
    name: verify-build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
