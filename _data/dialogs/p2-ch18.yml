dialog:
  - id: d01
    speaker: jisu
    ko: 안바르 씨, 여기가 경복궁 매표소예요.
    rom: Anbareu ssi, yeogiga Gyeongbokgung maepyosoyeyo.
    uz: Anvar, mana bu Gyeongbokgung saroyining bilet kassasi.
  - id: d02
    speaker: anvar
    ko: 입장료가 얼마예요?
    rom: Ipjangnyoga eolmayeyo?
    uz: Kiriş narxi qança?
  - id: d03
    speaker: jisu
    ko: 3천 원이에요. 그런데 한복을 입으면 무료예요.
    tts: { ko: "삼천 원이에요. 그런데 한복을 입으면 무료예요.", uz: "Uç ming von. Lekin hanbok kiysangiz, bepul." }
    rom: Samcheonwonieyo. Geureonde hanbogeul ibeumyeon muryoyeyo.
    uz: 3 000 von. Lekin hanbok kiysangiz, bepul.
  - id: d04
    speaker: anvar
    ko: 정말요? 그럼 저도 한복을 빌릴까요?
    rom: Jeongmallyo? Geureom jeodo hanbogeul billilkkayo?
    uz: Rostdanmi? Unda men ham hanbok ijaraga olaymi?
  - id: d05
    speaker: jisu
    ko: 오늘은 시간이 없으니까 다음에 빌려요.
    rom: Oneureun sigani eopseunikka daeume billyeoyo.
    uz: Bugun vaqtimiz kam, keyingi safar ijaraga olamiz.
  - id: d06
    speaker: anvar
    ko: 경복궁은 언제 지었어요?
    rom: Gyeongbokgungeun eonje jieosseoyo?
    uz: Gyeongbokgung qaçon qurilgan?
  - id: d07
    speaker: jisu
    ko: 1395년에 지었어요. 600년이 넘었어요.
    tts: { ko: "천삼백구십오 년에 지었어요. 육백 년이 넘었어요.", uz: "Bir ming uç yuz töqson beşinçi yilda qurilgan. Olti yuz yildan oşdi." }
    rom: Cheonsambaekgusibonyeone jieosseoyo. Yukbaengnyeoni neomeosseoyo.
    uz: 1395-yilda qurilgan. 600 yildan oşdi.
  - id: d08
    speaker: anvar
    ko: 여기에서 사진을 찍어도 돼요?
    rom: Yeogieseo sajineul jjigeodo dwaeyo?
    uz: Bu yerda suratga olsam böladimi?
  - id: d09
    speaker: jisu
    ko: 네, 괜찮아요. 하지만 건물 안에 들어가면 안 돼요.
    rom: Ne, gwaenchanayo. Hajiman geonmul ane deureogamyeon an dwaeyo.
    uz: Ha, böladi. Lekin binolarning içiga kirib bölmaydi.
  - id: d10
    speaker: anvar
    ko: 저기요, 사진 좀 찍어 주실 수 있어요?
    rom: Jeogiyo, sajin jom jjigeo jusil su isseoyo?
    uz: Keçirasiz, bizni suratga olib bera olasizmi?
  - id: d11
    speaker: passerby
    ko: 네, 하나, 둘, 셋! 잘 나왔어요.
    rom: Ne, hana, dul, set! Jal nawasseoyo.
    uz: Xöp, bir, ikki, uç! Yaxşi çiqdi.
  - id: d12
    speaker: anvar
    ko: 감사합니다!
    rom: Gamsahamnida!
    uz: Rahmat!

