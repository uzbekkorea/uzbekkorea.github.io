    ko: 내비게이션 있어요?
    rom: Naebigeisyeon isseoyo?
    uz: Navigator bormi?
  - id: p07
    speaker: narrator
    ko: 주유소가 어디에 있어요?
    rom: Juyusoga eodie isseoyo?
    uz: Yoqilği quyiş şoxobçasi qayerda?
  - id: p08
    speaker: narrator
    ko: 가득 넣어 주세요.
    rom: Gadeuk neoeo juseyo.
    uz: Bakni töldirib qöying.
  - id: p09
    speaker: narrator
    ko: 주차장이 어디예요?
    rom: Juchajangi eodiyeyo?
    uz: Avtoturargoh qayerda?
  - id: p10
    speaker: narrator
    ko: 차를 반납하러 왔어요.
    rom: Chareul bannapareo wasseoyo.
    uz: Maşinani qaytarişga keldim.
  - id: p11
    speaker: narrator
    ko: 차에 문제가 있어요.
    rom: Chae munjega isseoyo.
    uz: Maşinada muammo bor.
  - id: p12
