# Koreys tili 2-qism, 9-dars: Telefonda
#
# Audio is generated from this file with `uv run tools/tts.py p2-ch09`
# and saved to assets/audio/p2-ch09/. Edit text here, then re-run the script.
#
# Fields: id (unique, used in audio file names), speaker (key of `speakers`),
# ko (Korean), rom (Revised Romanization), uz (Uzbek, new alphabet).
# Optional per line:
#   tts: { ko: "...", uz: "..." }  text to speak when it differs from the text shown
#   duration: { ko: 0.8 }            fix a clip's length in seconds

speakers:
  colleague:
    name: 직원 (Hamkasbi)
    side: left
    voice:
      ko: { instruct: "female, middle-aged, moderate pitch", seed: 42 }
      uz: { instruct: "female, middle-aged, moderate pitch", seed: 42 }
  jisu:
    name: 지수 (Jisu)
    side: left
    voice:
      ko: { instruct: "female, young adult, moderate pitch", seed: 42 }
      uz: { instruct: "female, young adult, moderate pitch", seed: 42 }
  anvar:
    name: 안바르 (Anvar)
    side: right
    voice:
      ko: { instruct: "male, young adult, moderate pitch", seed: 7 }
      uz: { instruct: "male, young adult, moderate pitch", seed: 42 }
  narrator:
    name: ""
    voice:
      ko: { instruct: "female, young adult, moderate pitch", seed: 42 }
      uz: { instruct: "male, young adult, moderate pitch", seed: 42 }

dialog:
  - id: d01
    speaker: colleague
    ko: 여보세요. 한빛여행사입니다.
    rom: Yeoboseyo. Hanbit yeohaengsaimnida.
    uz: Allo. "Hanbit" sayohat agentligi.
  - id: d02
    speaker: anvar
    ko: 여보세요. 김지수 씨 좀 바꿔 주세요.
    rom: Yeoboseyo. Gim Jisu ssi jom bakkwo juseyo.
    uz: Allo. Kim Jisuni telefonga çaqirib bering.
  - id: d03
    speaker: colleague
    ko: 지금 자리에 안 계세요. 실례지만 누구세요?
    rom: Jigeum jarie an gyeseyo. Sillyejiman nuguseyo?
    uz: U hozir joyida yöq. Keçirasiz, kim bilan gaplaşyapman?
  - id: d04
    speaker: anvar
    ko: 저는 지수 씨 친구 안바르예요. 언제 들어오세요?
    rom: Jeoneun Jisu ssi chingu Anbareuyeyo. Eonje deureooseyo?
    uz: Men Jisuning dösti Anvarman. U qaçon qaytadi?
  - id: d05
    speaker: colleague
    ko: 오후 3시쯤 들어오실 거예요.
    tts: { ko: "오후 세 시쯤 들어오실 거예요.", uz: "Tuşdan keyin soat uçlarda qaytadi." }
    rom: Ohu sesijjeum deureoosil geoyeyo.
    uz: Tuşdan keyin soat 3 larda qaytadi.
  - id: d06
    speaker: anvar
    ko: 그럼 안바르가 전화했다고 전해 주세요.
    rom: Geureom Anbareuga jeonhwahaetdago jeonhae juseyo.
    uz: Unda Anvar qönğiroq qildi deb aytib qöying.
  - id: d07
    speaker: colleague
    ko: 네, 전해 드릴게요. 전화번호 좀 알려 주시겠어요?
    rom: Ne, jeonhae deurilgeyo. Jeonhwabeonho jom allyeo jusigesseoyo?
    uz: Xöp, aytib qöyaman. Telefon raqamingizni aytib bera olasizmi?
  - id: d08
    speaker: anvar
    ko: 010-1234-5678이에요.
    tts: { ko: "공일공, 일이삼사, 오육칠팔이에요.", uz: "Nol bir nol, bir ikki uç tört, beş olti yetti sakkiz." }
    rom: Gongilgong irisamsa oyukchilparieyo.
    uz: 010-1234-5678.
  - id: d09
    speaker: jisu
    ko: 여보세요, 안바르 씨? 저 지수예요. 전화했어요?
    rom: Yeoboseyo, Anbareu ssi? Jeo Jisuyeyo. Jeonhwahaesseoyo?
    uz: Allo, Anvar? Men Jisuman. Qönğiroq qilgan ekansiz-a?
  - id: d10
    speaker: anvar
    ko: 네, 오늘 저녁에 시간 있어요? 같이 저녁 먹을까요?
    rom: Ne, oneul jeonyeoge sigan isseoyo? Gachi jeonyeok meogeulkkayo?
    uz: Ha, bugun keçqurun böşmisiz? Birga keçki ovqat qilaylikmi?
  - id: d11
    speaker: jisu
    ko: 좋아요. 7시에 동대문역 1번 출구에서 만날까요?
    tts: { ko: "좋아요. 일곱 시에 동대문역 일 번 출구에서 만날까요?", uz: "Xöp. Soat yettida Dongdaemun bekatining birinçi çiqişida uçraşaylikmi?" }
    rom: Joayo. Ilgopsie Dongdaemunnyeok ilbeon chulgueseo mannalkkayo?
    uz: Xöp. Soat 7 da Dongdaemun bekatining 1-çiqişida uçraşaylikmi?
  - id: d12
    speaker: anvar
    ko: 네, 좋아요. 이따 봐요!
    rom: Ne, joayo. Itta bwayo!
    uz: Xöp, keliştik. Keyin körişamiz!

