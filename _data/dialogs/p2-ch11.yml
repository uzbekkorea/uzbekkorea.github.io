    speaker: narrator
    ko: 지하철역이 어디에 있어요?
    rom: Jihacheollyeogi eodie isseoyo?
    uz: Metro bekati qayerda?
  - id: p03
    speaker: narrator
    ko: 여기에서 멀어요?
    rom: Yeogieseo meoreoyo?
    uz: Bu yerdan uzoqmi?
  - id: p04
    speaker: narrator
    ko: 걸어서 갈 수 있어요?
    rom: Georeoseo gal su isseoyo?
    uz: Piyoda borsa böladimi?
  - id: p05
    speaker: narrator
    ko: 걸어서 몇 분 걸려요?
    rom: Georeoseo myeot bun geollyeoyo?
    uz: Piyoda neça daqiqa vaqt oladi?
  - id: p06
    speaker: narrator
    ko: 쭉 가세요.
    rom: Jjuk gaseyo.
    uz: Töğriga yuring.
  - id: p07
    speaker: narrator
    ko: 오른쪽으로 도세요.
    rom: Oreunjjogeuro doseyo.
    uz: Öngga buriling.
  - id: p08
    speaker: narrator
    ko: 왼쪽으로 도세요.
    rom: Oenjjogeuro doseyo.
    uz: Çapga buriling.
  - id: p09
    speaker: narrator
    ko: 길을 건너세요.
    rom: Gireul geonneoseyo.
    uz: Yöldan öting.
  - id: p10
    speaker: narrator
    ko: 은행 건너편에 있어요.
    rom: Eunhaeng geonneopyeone isseoyo.
    uz: Bankning qarşisida.
  - id: p11
    speaker: narrator
    ko: 이 지도에서 여기가 어디예요?
    rom: I jidoeseo yeogiga eodiyeyo?
    uz: Bu xaritada biz qayerdamiz?
  - id: p12
    speaker: narrator
    ko: 길을 잃어버렸어요.
    rom: Gireul ireobeoryeosseoyo.
    uz: Adaşib qoldim.
