    uz: Sovğa olmoqçiman.
  - id: p02
    speaker: narrator
    ko: 친구한테 줄 선물이에요.
    rom: Chinguhante jul seonmurieyo.
    uz: Bu döstimga sovğa.
  - id: p03
    speaker: narrator
    ko: 어머니한테 드릴 선물을 찾는데요.
    rom: Eomeonihante deuril seonmureul channeundeyo.
    uz: Onamga sovğa qidiryapman.
  - id: p04
    speaker: narrator
    ko: 구경만 해도 돼요?
    rom: Gugyeongman haedo dwaeyo?
    uz: Faqat tomoşa qilsam böladimi?
  - id: p05
    speaker: narrator
    ko: 이건 뭐로 만들었어요?
    rom: Igeon mworo mandeureosseoyo?
    uz: Bu nimadan yasalgan?
  - id: p06
    speaker: narrator
    ko: 한국 전통 물건이에요?
    rom: Hanguk jeontong mulgeonieyo?
    uz: Bu koreys anʼanaviy buyumimi?
  - id: p07
    speaker: narrator
    ko: 정말 예쁘네요.
    rom: Jeongmal yeppeuneyo.
    uz: Juda çiroyli ekan.
  - id: p08
    speaker: narrator
    ko: 이거 두 개 주세요.
    rom: Igeo du gae juseyo.
    uz: Bundan ikkita bering.
  - id: p09
    speaker: narrator
    ko: 선물 포장해 주세요.
    rom: Seonmul pojanghae juseyo.
    uz: Sovğa qilib örab bering.
  - id: p10
    speaker: narrator
    ko: 따로 포장해 주세요.
    rom: Ttaro pojanghae juseyo.
    uz: Alohida örab bering.
  - id: p11
    speaker: narrator
    ko: 쇼핑백 하나 더 주세요.
    rom: Syopingbaek hana deo juseyo.
    uz: Yana bitta xarid paketi bering.
  - id: p12
    speaker: narrator
    ko: 비행기에 가지고 탈 수 있어요?
    rom: Bihaenggie gajigo tal su isseoyo?
    uz: Buni samolyotga olib çiqsa böladimi?
