dialog:
  - id: d01
    speaker: anvar
    ko: 실례합니다. 서울역에 어떻게 가요?
    rom: Sillyehamnida. Seoullyeoge eotteoke gayo?
    uz: Keçirasiz, Seul vokzaliga qanday borsam böladi?
  - id: d02
    speaker: staff
    ko: 공항철도나 공항버스를 타세요.
    rom: Gonghangcheoldona gonghangbeoseureul taseyo.
    uz: Aeroport poyezdi yoki aeroport avtobusida borişingiz mumkin.
  - id: d03
    speaker: anvar
    ko: 어느 게 더 빨라요?
    rom: Eoneu ge deo ppallayo?
    uz: Qaysi biri tezroq?
  - id: d04
    speaker: staff
    ko: 공항철도가 더 빨라요. 서울역까지 한 시간쯤 걸려요.
    rom: Gonghangcheoldoga deo ppallayo. Seoullyeokkaji han siganjjeum geollyeoyo.
    uz: Poyezd tezroq. Seul vokzaligaça bir soatça vaqt oladi.
  - id: d05
    speaker: anvar
    ko: 표는 어디에서 사요?
    rom: Pyoneun eodieseo sayo?
    uz: Biletni qayerdan olaman?
  - id: d06
    speaker: staff
    ko: 교통카드를 사서 타시면 돼요. 편의점에서 팔아요.
    rom: Gyotongkadeureul saseo tasimyeon dwaeyo. Pyeonuijeomeseo parayo.
    uz: Transport kartasini olib, şu bilan minsangiz böladi. Dökonda sotiladi.
  - id: d07
    speaker: anvar
    ko: 충전도 편의점에서 해요?
    rom: Chungjeondo pyeonuijeomeseo haeyo?
    uz: Kartaga pulni ham dökonda solamanmi?
  - id: d08
    speaker: staff
    ko: 네, 편의점이나 역에서 충전할 수 있어요.
    rom: Ne, pyeonuijeomina yeogeseo chungjeonhal su isseoyo.
    uz: Ha, dökonda yoki bekatda pul solsangiz böladi.
  - id: d09
    speaker: anvar
    ko: 공항철도 타는 곳은 어디예요?
    rom: Gonghangcheoldo taneun goseun eodiyeyo?
    uz: Poyezdga qayerdan çiqiladi?
  - id: d10
    speaker: staff
    ko: 지하 1층으로 내려가세요. 표지판을 따라가시면 돼요.
    tts: { ko: "지하 일 층으로 내려가세요. 표지판을 따라가시면 돼요.", uz: "Yer osti birinçi qavatiga tuşing. Körsatkiçlar böyiça borsangiz böladi." }
    rom: Jiha il cheungeuro naeryeogaseyo. Pyojipaneul ttaragasimyeon dwaeyo.
    uz: Yer osti 1-qavatiga tuşing. Körsatkiçlar böyiça borsangiz böladi.
  - id: d11
    speaker: anvar
    ko: 정말 감사합니다.
    rom: Jeongmal gamsahamnida.
    uz: Katta rahmat.
  - id: d12
    speaker: staff
    ko: 즐거운 여행 되세요.
    rom: Jeulgeoun yeohaeng doeseyo.
    uz: Sayohatingiz yaxşi ötsin.

