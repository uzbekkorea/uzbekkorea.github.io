    ko: 죄송합니다.
    rom: Joesonghamnida.
    uz: Keçirasiz.
  - id: p09
    speaker: narrator
    ko: 괜찮아요.
    rom: Gwaenchanayo.
    uz: Heçqisi yöq.
  - id: p10
    speaker: narrator
    ko: 실례합니다.
    rom: Sillyehamnida.
    uz: Uzr, bezovta qilyapman.
  - id: p11
    speaker: narrator
    ko: 잠깐만요.
    rom: Jamkkanmanyo.
    uz: Bir daqiqa.
  - id: p12
    speaker: narrator
    ko: 다시 한번 말해 주세요.
    rom: Dasi hanbeon malhae juseyo.
    uz: Yana bir marta ayting.
  - id: p13
    speaker: narrator
    ko: 천천히 말해 주세요.
    rom: Cheoncheonhi malhae juseyo.
    uz: Sekinroq gapiring.
  - id: p14
