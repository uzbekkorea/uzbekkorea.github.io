    rom: Jihacheoreul jalmot tasseoyo.
    uz: Notöğri poyezdga çiqib qoldim.
  - id: p10
    speaker: narrator
    ko: 반대 방향으로 타야 돼요.
    rom: Bandae banghyangeuro taya dwaeyo.
    uz: Qarama-qarşi tomonga ketadigan poyezdga çiqiş kerak.
  - id: p11
    speaker: narrator
    ko: 여기 앉으세요.
    rom: Yeogi anjeuseyo.
    uz: Bu yerga ötiring.
  - id: p12
    speaker: narrator
    ko: 화장실이 어디에 있어요?
